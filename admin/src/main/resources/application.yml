server:
  port: 8080

spring:
  datasource:
    url: jdbc:sqlite:${SIPIM_DB:./sipim.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

sipim:
  upload-dir: ${SIPIM_UPLOAD_DIR:uploads}

logging:
  level:
    com.lab.sipim: INFO
