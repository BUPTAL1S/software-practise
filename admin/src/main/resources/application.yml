server:
  port: ${SERVER_PORT:8080}

spring:
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 65MB
      file-size-threshold: 0
  datasource:
    url: jdbc:sqlite:${SIPIM_DB:./sipim.db}
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    com.lab.sipim: INFO

freeswitch:
  esl:
    enabled: ${ESL_ENABLED:true}
    host: ${ESL_HOST:127.0.0.1}
    port: ${ESL_PORT:8021}
    password: ${ESL_PASSWORD:ClueCon}
    reconnect-interval-sec: 5
