#!KAMAILIO
#
# 阶段 1：REGISTER + 一对一 INVITE。不上 DB、不开鉴权、不进 MCU。
# PUBLIC_IP 由 ../start-kamailio.sh 或 start-kamailio.ps1 写入 public-ip.defs。
# Windows 桥接下容器 IP 会变，listen 绑 0.0.0.0，避免 Address not available。
#
# Docker Desktop 宿主机上的 UA 只能连 127.0.0.1:5060，连自己的校园网 IP:5060 会头发夹丢包。
# 所以 Record-Route 按「每一腿在哪」各给一条：宿主机 UA 用 127.0.0.1，校园网 UA 用 PUBLIC_IP。
# 主叫看 $si（经 Docker 网桥进来就是宿主机），被叫看 lookup 后 Contact 的主机。

#!include_file "public-ip.defs"

debug=2
log_stderror=yes
children=8
disable_tcp=no
tcp_connection_lifetime=3605
auto_aliases=no
dns_try_ipv6=no

listen=udp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise PUBLIC_IP:5060

alias="lab"
# 必须带端口：宿主机 UA 的 Contact 也是 PUBLIC_IP / 127.0.0.1，只是端口不同；
# 不带端口 is_myself() 会把 UA 当成代理自己，BYE 走严格路由兜底。
# 注意不能加引号：alias="x:5060" 会被当成名为 "x:5060" 的主机名，永远匹配不上
# （可用 kamcmd core.aliases_list 验证）。
alias=PUBLIC_IP:5060
# Docker Desktop 本机客户端只能连 127.0.0.1，RURI 域会变成这个。
alias=127.0.0.1:5060
alias=localhost:5060

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "default_expires", 300)
modparam("registrar", "gruu_enabled", 0)
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_full_lr", 0)
# record_route_preset 带两个地址时必须开；两条 RR 都带 r2=on，loose_route 才会一次剥掉两条。
modparam("rr", "enable_double_rr", 1)
modparam("rr", "append_fromtag", 1)

request_route {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if (!sanity_check()) {
		xlog("L_ERR", "Malformed SIP from $si:$sp\n");
		exit;
	}

	force_rport();

	if (has_totag()) {
		if (loose_route()) {
			route(STRIP_SELF_RR);
			if (is_method("BYE|ACK")) {
				xlog("L_INFO", "in-dialog $rm $fu -> $ru du=$du si=$si:$sp proto=$proto\n");
			}
			route(RELAY);
		} else {
			xlog("L_WARN", "loose_route failed $rm $fu -> $ru from $si:$sp proto=$proto\n");
			if (is_method("ACK")) {
				if (t_check_trans()) {
					route(RELAY);
				} else if (route(LOOKUP_AGAIN)) {
					xlog("L_INFO", "ACK fallback lookup $ru du=$du\n");
					route(RELAY);
				}
				exit;
			}
			if (is_method("BYE") && route(LOOKUP_AGAIN)) {
				xlog("L_INFO", "BYE fallback lookup $ru du=$du\n");
				route(RELAY);
			}
			sl_send_reply("404", "Not here");
		}
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	if (is_method("REGISTER")) {
		if (!route(LOCAL_DOMAIN)) {
			sl_send_reply("404", "Not for this domain");
			exit;
		}
		if (!save("location")) {
			sl_reply_error();
		}
		exit;
	}

	if (route(LOCAL_DOMAIN)) {
		if ($rU == $null) {
			sl_send_reply("484", "Address Incomplete");
			exit;
		}

		# 阶段 5 再转到 FreeSWITCH。一对一不得进 MCU。
		if ($rU =~ "^room-") {
			sl_send_reply("480", "MCU not ready in phase 1");
			exit;
		}

		if (!lookup("location")) {
			# t_newtran() 会覆盖 $retcode，先存下来。
			$var(lrc) = $retcode;
			t_newtran();
			if ($var(lrc) == -2) {
				send_reply("405", "Method Not Allowed");
			} else {
				xlog("L_INFO", "lookup miss $rm $ru rc=$var(lrc)\n");
				send_reply("404", "Not Found");
			}
			exit;
		}
	}

	# lookup 之后才知道被叫在哪，再决定两条 RR。
	if (is_method("INVITE|SUBSCRIBE")) {
		route(DOUBLE_RR);
	}

	route(RELAY);
}

route[LOCAL_DOMAIN] {
	if (is_myself("$rd") || $rd == "lab" || $rd == "PUBLIC_IP"
			|| $rd == "127.0.0.1" || $rd == "localhost") {
		return 1;
	}
	return -1;
}

# Docker Desktop 宿主机经端口映射进来：$si 是网桥网关（172.x.y.1）或 192.168.65.x，不是校园网 IP。
route[FROM_DOCKER_HOST] {
	if ($si == "127.0.0.1" || $si == "localhost") {
		return 1;
	}
	if ($si =~ "^172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]+\.1$") {
		return 1;
	}
	if ($si =~ "^192\.168\.65\.") {
		return 1;
	}
	return -1;
}

# 下一跳（$du 优先，否则 $ru）的主机是不是宿主机上的 UA：回环，或校园网 IP 但端口不是 5060。
route[NEXTHOP_ON_DOCKER_HOST] {
	if ($du != $null) {
		$var(nh) = $(du{uri.host});
		$var(np) = $(du{uri.port});
	} else {
		$var(nh) = $(ru{uri.host});
		$var(np) = $(ru{uri.port});
	}
	if ($var(nh) == "127.0.0.1" || $var(nh) == "localhost") {
		return 1;
	}
	if ($var(nh) == "PUBLIC_IP" && $var(np) != 0 && $var(np) != 5060) {
		return 1;
	}
	return -1;
}

# 第一参数 = 被叫回本代理的地址（RR 顶层）；第二参数 = 主叫回本代理的地址。
route[DOUBLE_RR] {
	if (route(FROM_DOCKER_HOST)) {
		$var(rr_caller) = "127.0.0.1:5060;transport=" + $proto;
	} else {
		$var(rr_caller) = "PUBLIC_IP:5060;transport=" + $proto;
	}
	if (route(NEXTHOP_ON_DOCKER_HOST)) {
		$var(rr_callee) = "127.0.0.1:5060;transport=" + $proto;
	} else {
		$var(rr_callee) = "PUBLIC_IP:5060;transport=" + $proto;
	}
	if ($var(rr_callee) == $var(rr_caller)) {
		if (!record_route_preset("$var(rr_callee)")) {
			xlog("L_ERR", "RR preset failed, fallback record_route\n");
			record_route();
		}
		xlog("L_INFO", "RR single $var(rr_callee) $rm si=$si\n");
		return;
	}
	$var(rr_callee) = $var(rr_callee) + ";r2=on";
	$var(rr_caller) = $var(rr_caller) + ";r2=on";
	if (!record_route_preset("$var(rr_callee)", "$var(rr_caller)")) {
		xlog("L_ERR", "RR double preset failed, fallback record_route\n");
		record_route();
	}
	xlog("L_INFO", "RR double callee=$var(rr_callee) caller=$var(rr_caller) $rm si=$si\n");
}

# r2=on 正常时 loose_route 已剥掉两条；这里只兜底：下一跳还是自己就再剥一层或查 usrloc。
route[STRIP_SELF_RR] {
	if (!route(HOP_IS_PROXY)) {
		return;
	}
	xlog("L_INFO", "strip extra self-RR $rm du=$du ru=$ru\n");
	if (loose_route()) {
		if (route(HOP_IS_PROXY)) {
			xlog("L_WARN", "still self after 2nd loose_route du=$du ru=$ru, lookup\n");
			route(LOOKUP_AGAIN);
		}
		return;
	}
	if (route(RURI_IS_PROXY)) {
		xlog("L_INFO", "RURI still proxy after strip, lookup $ru\n");
		route(LOOKUP_AGAIN);
	}
}

route[HOP_IS_PROXY] {
	if ($du != $null) {
		if ($(du{uri.host}) == "127.0.0.1" || $(du{uri.host}) == "localhost"
				|| $(du{uri.host}) == "PUBLIC_IP" || is_myself("$du")) {
			$var(p) = $(du{uri.port});
			if ($var(p) == 0 || $var(p) == 5060) {
				return 1;
			}
		}
		return -1;
	}
	if (route(RURI_IS_PROXY)) {
		return 1;
	}
	return -1;
}

route[RURI_IS_PROXY] {
	if ($(ru{uri.host}) != "127.0.0.1" && $(ru{uri.host}) != "localhost"
			&& $(ru{uri.host}) != "PUBLIC_IP" && !is_myself("$ru")) {
		return -1;
	}
	$var(p) = $(ru{uri.port});
	if ($var(p) != 0 && $var(p) != 5060) {
		return -1;
	}
	return 1;
}

# Docker 里 127.0.0.1 是容器自己；宿主机 UA 的 Contact 改到 host.docker.internal。
# :5060 在宿主机上被 Docker 映射给了 Kamailio 自己，绝不能往那儿转，否则环回。
route[TO_DOCKER_HOST] {
	if (!route(NEXTHOP_ON_DOCKER_HOST)) {
		return;
	}
	if ($var(np) == 0) {
		$var(np) = 5060;
	}
	if ($var(np) == 5060) {
		xlog("L_WARN", "next hop $var(nh):5060 is this proxy, refuse to loop $rm $fu -> $ru\n");
		sl_send_reply("482", "Loop Detected");
		exit;
	}
	$du = "sip:host.docker.internal:" + $var(np) + ";transport=" + $proto;
	xlog("L_INFO", "rewrite host Contact $var(nh):$var(np) to $du\n");
}

route[LOOKUP_AGAIN] {
	if ($rU == $null || route(RURI_IS_PROXY)) {
		if ($tU == $null) {
			return -1;
		}
		$ru = "sip:" + $tU + "@" + "lab";
		xlog("L_INFO", "lookup RURI from To user $tU -> $ru\n");
	}
	if (!route(LOCAL_DOMAIN)) {
		return -1;
	}
	if (!lookup("location")) {
		xlog("L_WARN", "lookup fallback miss $rm $ru\n");
		return -1;
	}
	return 1;
}

route[RELAY] {
	route(TO_DOCKER_HOST);
	t_on_failure("SIP_FAIL");
	if (!t_relay()) {
		xlog("L_ERR", "t_relay failed $rm $fu -> $ru du=$du\n");
		sl_reply_error();
	}
	exit;
}

failure_route[SIP_FAIL] {
	xlog("L_ERR", "forward failed code=$T_reply_code $rm $fu -> $ru du=$du\n");
	if (isflagset(1)) {
		exit;
	}
	if (is_method("BYE|ACK|CANCEL") && route(LOOKUP_AGAIN)) {
		setflag(1);
		if (route(NEXTHOP_ON_DOCKER_HOST)) {
			if ($var(np) == 0 || $var(np) == 5060) {
				xlog("L_ERR", "retry $rm would loop to proxy, give up\n");
				exit;
			}
			$du = "sip:host.docker.internal:" + $var(np) + ";transport=" + $proto;
		}
		xlog("L_INFO", "retry $rm via usrloc du=$du ru=$ru\n");
		if (!t_relay()) {
			xlog("L_ERR", "retry $rm failed\n");
		}
	}
}
