#!KAMAILIO
#
# 阶段 1：REGISTER + 一对一 INVITE。不上 DB、不开鉴权、不进 MCU。
# PUBLIC_IP 由 ../start-kamailio.sh 或 start-kamailio.ps1 写入 public-ip.defs。
# Windows 桥接下容器 IP 会变，listen 绑 0.0.0.0，避免 Address not available。
#
# Docker Desktop 本机 UA 只能连 127.0.0.1；若 Record-Route 一律 advertise 成
# PUBLIC_IP，Windows 的 BYE/ACK 会头发夹发不进容器。INVITE 上打双边 RR：
# 本机侧 127.0.0.1，校园网侧 PUBLIC_IP。loose_route 靠 alias 把两条都认成自己。

#!include_file "public-ip.defs"

debug=2
log_stderror=yes
children=8
disable_tcp=no
tcp_connection_lifetime=3605
auto_aliases=no
dns_try_ipv6=no

listen=udp:0.0.0.0:5060 advertise PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise PUBLIC_IP:5060

alias="lab"
alias="PUBLIC_IP"
# Docker Desktop 本机客户端只能连 127.0.0.1，RURI 域会变成这个。
alias="127.0.0.1"
alias="localhost"

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "default_expires", 300)
modparam("registrar", "gruu_enabled", 0)
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("rr", "enable_full_lr", 1)
# 双边 RR 由 DOUBLE_RR / record_route_preset 自己写，关掉自动 double，避免四条 Route。
modparam("rr", "enable_double_rr", 0)
modparam("rr", "append_fromtag", 1)

request_route {
	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if (!sanity_check()) {
		xlog("L_ERR", "Malformed SIP from $si:$sp\n");
		exit;
	}

	force_rport();

	if (has_totag()) {
		if (loose_route()) {
			# 双边 RR 都指向本代理时，下一跳不应还停在自己身上。
			if ($du != $null && (is_myself("$du")
					|| $(du{uri.host}) == "127.0.0.1"
					|| $(du{uri.host}) == "localhost"
					|| $(du{uri.host}) == "PUBLIC_IP")) {
				xlog("L_INFO", "in-dialog $rm next-hop-was-self du=$du ru=$ru from $si:$sp, use RURI\n");
				$du = $null;
			}
			if (is_method("BYE|ACK")) {
				xlog("L_INFO", "in-dialog $rm $fu -> $ru du=$du si=$si:$sp proto=$proto\n");
			}
			route(RELAY);
		} else {
			xlog("L_WARN", "loose_route failed $rm $fu -> $ru from $si:$sp proto=$proto\n");
			if (is_method("ACK")) {
				if (t_check_trans()) {
					route(RELAY);
				} else if (route(LOOKUP_AGAIN)) {
					xlog("L_INFO", "ACK fallback lookup $ru du=$du\n");
					route(RELAY);
				}
				exit;
			}
			if (is_method("BYE") && route(LOOKUP_AGAIN)) {
				xlog("L_INFO", "BYE fallback lookup $ru du=$du\n");
				route(RELAY);
			}
			sl_send_reply("404", "Not here");
		}
		exit;
	}

	if (is_method("CANCEL")) {
		if (t_check_trans()) {
			route(RELAY);
		}
		exit;
	}

	if (is_method("REGISTER")) {
		if (!route(LOCAL_DOMAIN)) {
			sl_send_reply("404", "Not for this domain");
			exit;
		}
		if (!save("location")) {
			sl_reply_error();
		}
		exit;
	}

	if (is_method("INVITE|SUBSCRIBE")) {
		route(DOUBLE_RR);
	}

	if (route(LOCAL_DOMAIN)) {
		if ($rU == $null) {
			sl_send_reply("484", "Address Incomplete");
			exit;
		}

		# 阶段 5 再转到 FreeSWITCH。一对一不得进 MCU。
		if ($rU =~ "^room-") {
			sl_send_reply("480", "MCU not ready in phase 1");
			exit;
		}

		if (!lookup("location")) {
			t_newtran();
			switch ($retcode) {
				case -1:
				case -3:
					send_reply("404", "Not Found");
					exit;
				case -2:
					send_reply("405", "Method Not Allowed");
					exit;
			}
		}
	}

	route(RELAY);
}

route[LOCAL_DOMAIN] {
	if (is_myself("$rd") || $rd == "lab" || $rd == "PUBLIC_IP"
			|| $rd == "127.0.0.1" || $rd == "localhost") {
		return 1;
	}
	return -1;
}

# Docker Desktop 宿主机经端口映射进来，$si 是网桥，不是校园网 IP。
route[FROM_DOCKER_HOST] {
	if ($si == "127.0.0.1" || $si == "localhost") {
		return 1;
	}
	if ($si =~ "^172\.(1[6-9]|2[0-9]|3[0-1])\.") {
		return 1;
	}
	if ($si =~ "^192\.168\.65\.") {
		return 1;
	}
	return -1;
}

# 第一参数 = 被叫用来回本代理的地址；第二参数 = 主叫用来回本代理的地址。
route[DOUBLE_RR] {
	$var(rr_pub) = "PUBLIC_IP:5060;transport=" + $proto;
	$var(rr_lo) = "127.0.0.1:5060;transport=" + $proto;
	if (route(FROM_DOCKER_HOST)) {
		record_route_preset("$var(rr_pub)", "$var(rr_lo)");
		xlog("L_INFO", "RR docker-host $si $rm callee=PUBLIC_IP caller=127.0.0.1\n");
	} else {
		record_route_preset("$var(rr_lo)", "$var(rr_pub)");
		xlog("L_INFO", "RR campus $si $rm callee=127.0.0.1 caller=PUBLIC_IP\n");
	}
}

# Docker 里 127.0.0.1 / PUBLIC_IP 都是宿主机。Contact 若写成这两处，改到 host.docker.internal。
route[TO_DOCKER_HOST] {
	$var(h) = $null;
	$var(p) = 0;
	if ($du != $null) {
		$var(h) = $(du{uri.host});
		$var(p) = $(du{uri.port});
	} else {
		$var(h) = $(ru{uri.host});
		$var(p) = $(ru{uri.port});
	}
	if ($var(h) != "127.0.0.1" && $var(h) != "localhost" && $var(h) != "PUBLIC_IP") {
		return;
	}
	if ($var(p) == 0) {
		$var(p) = 5060;
	}
	$du = "sip:host.docker.internal:" + $var(p) + ";transport=" + $proto;
	xlog("L_INFO", "rewrite host Contact $var(h):$var(p) to $du\n");
}

route[LOOKUP_AGAIN] {
	if (!route(LOCAL_DOMAIN)) {
		return -1;
	}
	if (!lookup("location")) {
		xlog("L_WARN", "lookup fallback miss $rm $ru\n");
		return -1;
	}
	return 1;
}

route[RELAY] {
	route(TO_DOCKER_HOST);
	t_on_failure("SIP_FAIL");
	if (!t_relay()) {
		xlog("L_ERR", "t_relay failed $rm $fu -> $ru du=$du\n");
		sl_reply_error();
	}
	exit;
}

failure_route[SIP_FAIL] {
	xlog("L_ERR", "forward failed code=$T_reply_code $rm $fu -> $ru du=$du\n");
	if (isflagset(1)) {
		exit;
	}
	if (is_method("BYE|ACK|CANCEL") && route(LOOKUP_AGAIN)) {
		setflag(1);
		route(TO_DOCKER_HOST);
		xlog("L_INFO", "retry $rm via usrloc du=$du ru=$ru\n");
		if (!t_relay()) {
			xlog("L_ERR", "retry $rm failed\n");
		}
	}
}
