# 本机只跑 SIP 相关容器。业务库是后台进程里的 SQLite，不在这里。
# Windows / Docker Desktop：用桥接 + 端口映射。不要用 host 网络。
# listen / advertise 的 PUBLIC_IP 由 ./start-kamailio.sh 或 ./start-kamailio.ps1 探测写入。

services:
  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:5.8.3-alpine
    container_name: kamailio
    entrypoint: ["kamailio"]
    command: ["-DD", "-E", "-m", "64", "-M", "8"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
    ports:
      - target: 5060
        published: 5060
        protocol: udp
      - target: 5060
        published: 5060
        protocol: tcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kamailio:/etc/kamailio
    restart: unless-stopped

  # 阶段 4：只对外提供 ESL。不要把本目录挂到 /etc/freeswitch，空目录会盖掉镜像配置。
  # 阶段 5 才把 room-* 从 Kamailio 转到这里。一对一仍不进这个容器。
  freeswitch:
    image: safarov/freeswitch:1.10.12
    container_name: freeswitch
    # 镜像默认听 :: ，Docker 里没有 IPv6，event_socket 会绑失败。这个脚本改成 0.0.0.0。
    entrypoint: ["/bin/sh", "/lab-entrypoint.sh"]
    volumes:
      - ./freeswitch/lab-entrypoint.sh:/lab-entrypoint.sh:ro
    ports:
      - "5080:5080/udp"
      - "5080:5080/tcp"
      - "8021:8021"
    restart: unless-stopped
