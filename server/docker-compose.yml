# 本机只跑 SIP 相关容器。业务库是后台进程里的 SQLite，不在这里。
# Windows / Docker Desktop：用桥接 + 端口映射。不要用 host 网络。
# listen / advertise 的 PUBLIC_IP 由 ./start-kamailio.sh 或 ./start-kamailio.ps1 探测写入。

services:
  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:5.8.3-alpine
    container_name: kamailio
    entrypoint: ["kamailio"]
    command: ["-DD", "-E", "-m", "64", "-M", "8"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
    ports:
      - target: 5060
        published: 5060
        protocol: udp
      - target: 5060
        published: 5060
        protocol: tcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./kamailio:/etc/kamailio
    restart: unless-stopped

  # 阶段 5 MCU 会议室容器 (FreeSWITCH mod_conference + ESL)
  # 启用：docker compose --profile mcu up -d
  # RTP 21000-21099/udp 必须发布，否则会议室媒体停在容器里。
  freeswitch:
    image: safarov/freeswitch:1.11.3
    container_name: freeswitch
    profiles: ["mcu"]
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5080:5080/udp"
      - "5080:5080/tcp"
      - "127.0.0.1:8021:8021"
      - "21000-21099:21000-21099/udp"
    volumes:
      - ./freeswitch:/tmp/freeswitch-custom:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ ! -f /etc/freeswitch/switch.conf.xml ]; then
          mkdir -p /etc/freeswitch
          cp -varf /usr/share/freeswitch/conf/vanilla/* /etc/freeswitch/
        fi
        cp -varf /tmp/freeswitch-custom/* /etc/freeswitch/
        if [ -d /tmp/freeswitch-custom/sounds ]; then
          mkdir -p /usr/share/freeswitch/sounds
          cp -varf /tmp/freeswitch-custom/sounds/* /usr/share/freeswitch/sounds/
        fi
        if [ -n "$$PUBLIC_IP" ]; then
          sed -i "s/external_rtp_ip=127.0.0.1/external_rtp_ip=$$PUBLIC_IP/" /etc/freeswitch/vars.xml
          sed -i "s/external_sip_ip=127.0.0.1/external_sip_ip=$$PUBLIC_IP/" /etc/freeswitch/vars.xml
        fi
        sed -i 's|<!-- <param name="rtp-start-port" value="16384"/> -->|<param name="rtp-start-port" value="21000"/>|' /etc/freeswitch/autoload_configs/switch.conf.xml
        sed -i 's|<!-- <param name="rtp-end-port" value="32768"/> -->|<param name="rtp-end-port" value="21099"/>|' /etc/freeswitch/autoload_configs/switch.conf.xml
        sed -i 's|<!-- <param name="profile" value="baseline"/> -->|<param name="profile" value="baseline"/>|' /etc/freeswitch/autoload_configs/av.conf.xml
        sed -i 's|<!-- <param name="level" value="41"/> -->|<param name="level" value="30"/>|' /etc/freeswitch/autoload_configs/av.conf.xml
        if ! grep -q 'option name="bframes"' /etc/freeswitch/autoload_configs/av.conf.xml; then
          sed -i 's|<option name="preset" value="veryfast"/>|<option name="preset" value="veryfast"/><option name="profile" value="baseline"/><option name="level" value="3.0"/><option name="bframes" value="0"/>|g' /etc/freeswitch/autoload_configs/av.conf.xml
        fi
        exec /entrypoint.sh
    restart: unless-stopped
