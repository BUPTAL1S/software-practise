# 本机只跑 SIP 相关容器。业务库是后台进程里的 SQLite，不在这里。
# 镜像 tag 选定后回写 docs/deps.md。
# host 网络在 Mac/Windows 的 Docker Desktop 上不稳：阶段 1 请在一台 Linux 上起 compose。

services:
  kamailio:
    image: ghcr.io/kamailio/kamailio:5.8.3-alpine
    network_mode: host
    volumes:
      - ./kamailio:/etc/kamailio

  freeswitch:
    image: safarov/freeswitch:latest
    network_mode: host
    volumes:
      - ./freeswitch:/etc/freeswitch
